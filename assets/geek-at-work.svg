<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img" aria-label="An ML engineer at a three-monitor workstation training models on GPU and TPU hardware, with a leaderboard showing rank #1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9EDF8"/><stop offset="1" stop-color="#DCE3F4"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FB5A6"/><stop offset="1" stop-color="#138577"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#19C3B1" stop-opacity="0.55"/><stop offset="1" stop-color="#19C3B1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB020" stop-opacity="0.6"/><stop offset="1" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>
    <g id="fan">
      <circle r="17" fill="#15183A" stroke="#3A3F66" stroke-width="2"/>
      <g fill="#19C3B1" opacity="0.85">
        <path d="M0 0 C 4 -6, 10 -12, 3 -15 C -2 -10, -2 -4, 0 0Z"/>
        <path d="M0 0 C 4 -6, 10 -12, 3 -15 C -2 -10, -2 -4, 0 0Z" transform="rotate(90)"/>
        <path d="M0 0 C 4 -6, 10 -12, 3 -15 C -2 -10, -2 -4, 0 0Z" transform="rotate(180)"/>
        <path d="M0 0 C 4 -6, 10 -12, 3 -15 C -2 -10, -2 -4, 0 0Z" transform="rotate(270)"/>
      </g>
      <circle r="3.5" fill="#E9EDF8"/>
    </g>
    <g id="chip">
      <rect x="-17" y="-17" width="34" height="34" rx="5" fill="#23264F"/>
      <rect x="-11" y="-11" width="22" height="22" rx="3" fill="none" stroke="#19C3B1" stroke-width="1.5"/>
      <g stroke="#8A90B8" stroke-width="2" stroke-linecap="round">
        <path d="M-9 -17v-5M0 -17v-5M9 -17v-5M-9 17v5M0 17v5M9 17v5M-17 -9h-5M-17 0h-5M-17 9h-5M17 -9h5M17 0h5M17 9h5"/>
      </g>
    </g>
  </defs>

  <!-- backdrop -->
      <ellipse cx="340" cy="410" rx="300" ry="12" fill="none" stroke="#9AA3C7" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- floating accelerator chips -->
  <g transform="translate(140 62)">
    <animateTransform attributeName="transform" type="translate" values="140 62;140 54;140 62" dur="4s" repeatCount="indefinite"/>
    <circle r="30" fill="url(#glow)"/><use href="#chip"/>
    <text y="3" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#E9EDF8">CPU</text>
  </g>
  <g transform="translate(340 40)">
    <animateTransform attributeName="transform" type="translate" values="340 40;340 32;340 40" dur="4s" begin="1.3s" repeatCount="indefinite"/>
    <circle r="30" fill="url(#glow)"/><use href="#chip"/>
    <text y="3" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#E9EDF8">GPU</text>
  </g>
  <g transform="translate(540 62)">
    <animateTransform attributeName="transform" type="translate" values="540 62;540 54;540 62" dur="4s" begin="2.6s" repeatCount="indefinite"/>
    <circle r="30" fill="url(#glow)"/><use href="#chip"/>
    <text y="3" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#E9EDF8">TPU</text>
  </g>

  <!-- left monitor: code being typed -->
  <rect x="86" y="118" width="160" height="104" rx="8" fill="#2B2D6E"/>
  <rect x="93" y="125" width="146" height="90" rx="4" fill="#10132E"/>
  <g font-family="Consolas, Menlo, monospace" font-size="8" fill="#8A90B8"><text x="99" y="137">model.py</text></g>
  <g stroke-linecap="round" stroke-width="4">
    <line x1="100" y1="148" x2="160" y2="148" stroke="#FF7AA8"/>
    <line x1="108" y1="158" x2="200" y2="158" stroke="#19C3B1"/>
    <line x1="108" y1="168" x2="176" y2="168" stroke="#FFB020"/>
    <line x1="116" y1="178" x2="220" y2="178" stroke="#7C8CFF"/>
    <line x1="116" y1="188" x2="116" y2="188" stroke="#19C3B1">
      <animate attributeName="x2" values="116;196;196;116" keyTimes="0;0.55;0.9;1" dur="3.2s" repeatCount="indefinite"/>
    </line>
    <line x1="108" y1="198" x2="150" y2="198" stroke="#FF7AA8"/>
  </g>
  <rect x="200" y="183" width="2.5" height="10" fill="#E9EDF8">
    <animate attributeName="x" values="118;198;198;118" keyTimes="0;0.55;0.9;1" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="160" y="222" width="12" height="18" fill="#3A3F66"/><rect x="146" y="238" width="40" height="6" rx="3" fill="#3A3F66"/>

  <!-- center monitor: loss curve converging -->
  <rect x="254" y="92" width="172" height="132" rx="8" fill="#2B2D6E"/>
  <rect x="261" y="99" width="158" height="118" rx="4" fill="#10132E"/>
  <text x="268" y="113" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#8A90B8">training loss</text>
  <g stroke="#23264F" stroke-width="1"><path d="M270 130H410M270 155H410M270 180H410M270 205H410"/></g>
  <path d="M272 124 C 292 170, 308 186, 330 192 S 380 200, 410 202" fill="none" stroke="#19C3B1" stroke-width="3" stroke-linecap="round" stroke-dasharray="190" stroke-dashoffset="190">
    <animate attributeName="stroke-dashoffset" values="190;0;0;190" keyTimes="0;0.6;0.92;1" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M272 132 C 294 172, 312 186, 334 190 S 384 196, 410 198" fill="none" stroke="#FFB020" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8"/>
  <rect x="332" y="220" width="16" height="22" fill="#3A3F66"/><rect x="316" y="238" width="48" height="6" rx="3" fill="#3A3F66"/>

  <!-- right monitor: leaderboard -->
  <rect x="434" y="118" width="160" height="104" rx="8" fill="#2B2D6E"/>
  <rect x="441" y="125" width="146" height="90" rx="4" fill="#10132E"/>
  <text x="448" y="139" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#8A90B8">leaderboard</text>
  <rect x="446" y="146" width="136" height="18" rx="4" fill="#FFB020">
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="453" y="159" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#10132E">#1</text>
  <rect x="474" y="152" width="70" height="5" rx="2.5" fill="#10132E" opacity="0.55"/>
  <path d="M566 150h10v4a5 5 0 0 1 -10 0z M569 158h4v3h-4z M567 161h8v2h-8z" fill="#10132E"/>
  <g fill="#3A3F66">
    <text x="453" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#8A90B8">#2</text>
    <rect x="474" y="173" width="58" height="5" rx="2.5"/>
    <text x="453" y="199" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#8A90B8">#3</text>
    <rect x="474" y="192" width="46" height="5" rx="2.5"/>
  </g>
  <rect x="508" y="222" width="12" height="18" fill="#3A3F66"/><rect x="494" y="238" width="40" height="6" rx="3" fill="#3A3F66"/>

  <!-- desk -->
  <rect x="70" y="244" width="540" height="12" rx="4" fill="#3A3F66"/>
  <rect x="92" y="256" width="10" height="150" fill="#4B4F7A"/>
  <rect x="440" y="256" width="10" height="150" fill="#4B4F7A"/>

  <!-- coffee -->
  <g transform="translate(420 226)">
    <rect x="0" y="0" width="16" height="18" rx="3" fill="#FF7AA8"/>
    <path d="M16 4 h4 a4 4 0 0 1 0 9 h-4" fill="none" stroke="#FF7AA8" stroke-width="2.5"/>
    <path d="M5 -3 q-3 -5 0 -10 M11 -3 q-3 -5 0 -10" fill="none" stroke="#8A90B8" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- GPU tower with spinning fans -->
  <rect x="490" y="268" width="96" height="138" rx="8" fill="#23264F"/>
  <rect x="498" y="278" width="80" height="4" rx="2" fill="#19C3B1">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(538 318)"><use href="#fan"/>
  </g>
  <g transform="translate(538 366)"><use href="#fan"/>
  </g>

  <!-- person (seen from behind) -->
  <g>
    <!-- torso / hoodie -->
    <path d="M290 318 C 286 282, 298 256, 340 252 C 382 256, 394 282, 390 318 Z" fill="url(#hoodie)"/>
    <!-- arms reaching to keyboard -->
    <path d="M298 284 C 292 270, 300 256, 316 250" fill="none" stroke="#138577" stroke-width="13" stroke-linecap="round"/>
    <path d="M382 284 C 388 270, 380 256, 364 250" fill="none" stroke="#138577" stroke-width="13" stroke-linecap="round"/>
    <!-- neck + head -->
    <rect x="332" y="236" width="16" height="18" rx="6" fill="#B97A55"/>
    <circle cx="316" cy="226" r="5" fill="#C68A62"/><circle cx="364" cy="226" r="5" fill="#C68A62"/>
    <circle cx="340" cy="222" r="24" fill="#1D1D2B"/>
    <path d="M322 206 C 330 198, 348 196, 358 206" fill="none" stroke="#2E2E44" stroke-width="3" stroke-linecap="round"/>
    <path d="M328 238 C 334 242, 346 242, 352 238" fill="none" stroke="#2E2E44" stroke-width="2" stroke-linecap="round"/>
    <!-- headphones -->
    <path d="M314 222 C 312 190, 368 190, 366 222" fill="none" stroke="#2B2D6E" stroke-width="5"/>
    <rect x="308" y="214" width="10" height="18" rx="4" fill="#2B2D6E"/>
    <rect x="362" y="214" width="10" height="18" rx="4" fill="#2B2D6E"/>
  </g>
  <rect x="306" y="244" width="68" height="5" rx="2" fill="#8A90B8"/>
  <!-- chair back in front of person -->
  <rect x="300" y="286" width="80" height="70" rx="16" fill="#4B4F7A"/>
  <rect x="296" y="352" width="88" height="12" rx="6" fill="#3A3F66"/>
  <rect x="336" y="364" width="8" height="30" fill="#3A3F66"/>
  <path d="M300 398 h80" stroke="#3A3F66" stroke-width="6" stroke-linecap="round"/>
  <circle cx="302" cy="404" r="5" fill="#23264F"/><circle cx="340" cy="404" r="5" fill="#23264F"/><circle cx="378" cy="404" r="5" fill="#23264F"/>

  <!-- trophy on desk, pulse glow -->
  <g transform="translate(222 222)">
    <circle cx="0" cy="8" r="20" fill="url(#amberGlow)">
      <animate attributeName="r" values="16;22;16" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M-8 -2h16v6a8 8 0 0 1 -16 0z" fill="#FFB020"/>
    <path d="M-8 0h-4a4 4 0 0 0 4 6M8 0h4a4 4 0 0 1 -4 6" fill="none" stroke="#FFB020" stroke-width="2"/>
    <rect x="-2" y="11" width="4" height="6" fill="#E09400"/><rect x="-7" y="17" width="14" height="4" rx="1" fill="#E09400"/>
  </g>
</svg>
